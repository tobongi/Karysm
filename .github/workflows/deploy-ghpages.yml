name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/deploy-ghpages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Expo web
        working-directory: apps/mobile
        env:
          EXPO_BASE_URL: /Karysm
        run: npx expo export --platform web --output-dir dist

      - name: Patch expo-modules-core (registerWebModule crash fix)
        working-directory: apps/mobile/dist
        run: |
          BUNDLE=$(ls _expo/static/js/web/entry-*.js 2>/dev/null | head -1)
          if [ -z "$BUNDLE" ]; then echo "ERROR: bundle not found"; ls _expo/static/js/web/; exit 1; fi
          echo "Patching: $BUNDLE"
          node -e "
          const fs = require('fs');
          let code = fs.readFileSync('$BUNDLE', 'utf8');
          const before = code.length;
          code = code.replace(
            \"const s=l.name;if(!s)throw new Error('Module implementation must be a class')\",
            \"const s=l.name||('ExpoModule_'+Math.random().toString(36).slice(2));if(false)throw new Error('noop')\"
          );
          code = code.replace(
            'return globalThis.expo.modules[s]=new l,globalThis.expo.modules[s]',
            'try{return globalThis.expo.modules[s]=new l,globalThis.expo.modules[s]}catch(e){return globalThis.expo.modules[s]=typeof l===\"function\"?l():l,globalThis.expo.modules[s]}'
          );
          fs.writeFileSync('$BUNDLE', code);
          console.log('Patch OK — bytes:', before, '->', code.length);
          "

      - name: Make unlisted (noindex + robots.txt)
        working-directory: apps/mobile/dist
        run: |
          # Block all search engine crawlers
          printf 'User-agent: *\nDisallow: /\n' > robots.txt

          # Inject noindex into index.html
          node -e "
          const fs = require('fs');
          let h = fs.readFileSync('index.html', 'utf8');
          h = h.replace('<head>', '<head><meta name=\"robots\" content=\"noindex, nofollow, noarchive\">');
          fs.writeFileSync('index.html', h);
          "

      - name: GitHub Pages config
        working-directory: apps/mobile/dist
        run: |
          touch .nojekyll
          cp index.html 404.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/mobile/dist
          force_orphan: true
