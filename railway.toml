[build]
builder = "nixpacks"
buildCommand = "corepack enable && pnpm install --frozen-lockfile && cd packages/db && pnpm exec prisma generate"

[deploy]
startCommand = "cd apps/api && npx tsx src/server.ts"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
