<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="600" height="120">
  <defs>
    <!-- Gradient for decorative letters T and S -->
    <linearGradient id="decorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#2D1B69"/>
    </linearGradient>
  </defs>

  <!-- T — Decorative serif variation with swash -->
  <text x="0" y="95"
    font-family="Georgia, 'Playfair Display', 'Times New Roman', serif"
    font-size="110"
    font-weight="700"
    font-style="normal"
    fill="url(#decorGrad)"
    letter-spacing="-2">T</text>

  <!-- okos — Italic modern -->
  <text x="62" y="95"
    font-family="Georgia, 'Playfair Display', 'Times New Roman', serif"
    font-size="100"
    font-weight="400"
    font-style="italic"
    fill="#1A1A1A"
    letter-spacing="-1">okos</text>

  <!-- S — Decorative serif variation with swash -->
  <text x="370" y="95"
    font-family="Georgia, 'Playfair Display', 'Times New Roman', serif"
    font-size="110"
    font-weight="700"
    font-style="normal"
    fill="url(#decorGrad)"
    letter-spacing="-2">s</text>

  <!-- Dot / accent — terracotta beauty dot -->
  <circle cx="420" cy="18" r="6" fill="#E07A5F"/>
</svg>
